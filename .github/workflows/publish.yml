name: Publish

on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
      - .gitignore
      - .github/**

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20.x]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v1
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; pin to 11.x (npm 12 dropped Node 20).
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run test

      - name: Setup GIT
        run: |
          git reset --hard
          git config --local --list
          git checkout master
          git config user.email "$GH_EMAIL"
          git config user.name "Francisco Hodge"
        env:
          GH_EMAIL: ${{secrets.GH_EMAIL}}

      - name: Bump version
        run: |
          git reset --hard
          npm version patch
          npm run build
          git add . || true
          git commit -m "Build update" || true
          git push "https://$GITHUB_ACTOR:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: npm publish
        run: npm publish
